<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AiRashed Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .chat-container { width: 100%; max-width: 600px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .chat-box { height: 400px; border: 1px solid #ddd; border-radius: 4px; padding: 10px; overflow-y: scroll; margin-bottom: 15px; background: #fafafa; }
        .message { margin-bottom: 10px; padding: 8px 12px; border-radius: 6px; max-width: 80%; word-wrap: break-word; }
        .user-message { background: #dcf8c6; margin-left: auto; text-align: right; }
        .ai-message { background: #e2e2e2; margin-right: auto; }
        .input-group { display: flex; gap: 10px; }
        input[type="text"] { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 4px; outline: none; }
        button { padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>

<div class="chat-container">
    <h2>AiRashed Chat</h2>
    <div class="chat-box" id="chatBox"></div>
    <div class="input-group">
        <input type="text" id="userInput" placeholder="আপনার বার্তা এখানে লিখুন..." onkeypress="handleKeyPress(event)">
        <button onclick="sendMessage()">পাঠান</button>
    </div>
</div>

<script>
    async function sendMessage() {
        const inputField = document.getElementById('userInput');
        const chatBox = document.getElementById('chatBox');
        const text = inputField.value.trim();

        if (!text) return;

        chatBox.innerHTML += `<div class="message user-message"><b>রাশেদ:</b> ${text}</div>`;
        inputField.value = '';
        chatBox.scrollTop = chatBox.scrollHeight;

        const loadingId = 'loading_' + Date.now();
        chatBox.innerHTML += `<div id="${loadingId}" class="message ai-message"><b>AiRashed:</b> উত্তর খুঁজছি...</div>`;
        chatBox.scrollTop = chatBox.scrollHeight;

        try {
            const response = await fetch('/v1/chat', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer my_secret_token'
                },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: [{ role: "user", content: text }]
                })
            });

            const data = await response.json();
            const loadingElem = document.getElementById(loadingId);
            if (loadingElem) loadingElem.remove();

            if (response.ok) {
                const answer = data.response || "কোনো উত্তর পাওয়া যায়নি।";
                chatBox.innerHTML += `<div class="message ai-message"><b>AiRashed:</b> ${answer}</div>`;
            } else {
                chatBox.innerHTML += `<div class="message ai-message" style="color: red;"><b>সার্ভার সমস্যা:</b> ${data.error || 'অজানা ত্রুটি'}</div>`;
            }
        } catch (error) {
            const loadingElem = document.getElementById(loadingId);
            if (loadingElem) loadingElem.remove();
            chatBox.innerHTML += `<div class="message ai-message" style="color: red;"><b>ত্রুটি:</b> সংযোগ স্থাপন করা যায়নি।</div>`;
        }
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    function handleKeyPress(event) {
        if (event.key === 'Enter') {
            sendMessage();
        }
    }
</script>

</body>
</html>
