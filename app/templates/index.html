<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Fusion BD Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1f1f1f;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            border-bottom: 1px solid #333;
            color: #4CAF50;
        }
        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .message {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user-message {
            background-color: #2b5278;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .ai-message {
            background-color: #262626;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
            border: 1px solid #333;
        }
        #input-container {
            display: flex;
            padding: 15px;
            background-color: #1f1f1f;
            border-top: 1px solid #333;
            gap: 10px;
        }
        #user-input {
            flex: 1;
            padding: 12px;
            background-color: #2b2b2b;
            border: 1px solid #444;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }
        #user-input:focus {
            border-color: #4CAF50;
        }
        #send-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        #send-btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <header>AI Fusion BD - Chat Interface</header>

    <div id="chat-container">
        <div class="message ai-message">হ্যালো! আমি আপনার এআই সহকারী। আজ আপনাকে কীভাবে সাহায্য করতে পারি?</div>
    </div>

    <div id="input-container">
        <input type="text" id="user-input" placeholder="আপনার বার্তা এখানে লিখুন..." autofocus>
        <button id="send-btn" onclick="sendMessage()">পাঠান</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const userInput = document.getElementById('user-input');

        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Append User Message
            appendMessage(text, 'user-message');
            userInput.value = '';
            chatContainer.scrollTop = chatContainer.scrollHeight;

            // Call Backend API (/v1/chat)
            try {
                const response = await fetch('/v1/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        messages: [{ role: 'user', content: text }]
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    appendMessage(data.response || "উত্তর পাওয়া গেছে।", 'ai-message');
                } else {
                    appendMessage("এরর: " + (data.error?.message || "সার্ভার থেকে সাড়া পাওয়া যায়নি।"), 'ai-message');
                }
            } catch (error) {
                appendMessage("নেটওয়ার্ক সংযোগে সমস্যা হয়েছে।", 'ai-message');
            }
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function appendMessage(text, className) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${className}`;
            msgDiv.textContent = text;
            chatContainer.appendChild(msgDiv);
        }
    </script>
</body>
</html>
